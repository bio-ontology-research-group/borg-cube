# Robert, 2026-09-07: the Hermes gateway on ws (@hermes-ws on Mattermost) is part of
# the fleet. It is the group's voice on Mattermost: the daily infra report from the
# sysadmin's review, the morning literature brief from the literature agent, and
# Robert's commands relayed to the coordinator (ADR-0020). Its source of truth stays
# ~/Public/software/borg-infrastructure/hermes-infra (deploy.sh); the cube never
# runs it as a workday: the Hermes gateway and its cron jobs drive it, and they
# call cube and bd on ws.
name: hermes-ws
kind: functional
title: Mattermost concierge (hermes-ws)
charter: agents/hermes-ws/charter.md
topics:
- neuro-symbolic-ai
role: concierge
skills: []
runtime: hermes
tier: bulk
host: ws
privacy_default: internal
memory_dir: agents/hermes-ws/memory
resources:
  node005_gpu_hours_per_day: 0.0
  ws_cpu: true
  ibex: none
  spend_usd_per_day: 0.0
  outbound: none
workday:
  cron: "0 5 31 2 *"   # never fires (31 February): Hermes cron drives this agent, not cube
  max_minutes: 1
  max_runs: 0          # zero runs a day: cube never plays this agent
  max_runs_per_tick: 1
reports: weekly
