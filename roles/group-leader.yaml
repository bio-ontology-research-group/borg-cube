name: group-leader
summary: Designs the group's work backlog from goals, milestones and papers, and turns findings into beads with acceptance criteria for Robert to approve.
tier: plan
runtime: claude
model: z-ai/glm-5.3-flash  # daily reviews on the Flash harness entry, fallbacks keep their own models; Robert 2026-09-05
hermes_profile: null
allowed_tools: [Read, Grep, Glob, Bash(bd *), Bash(cube *)]
permission_mode: read-only
skills: [delegation, research-planning, group-monitor]
system_prompt_file: roles/prompts/group-leader.md
can_close: true         # closes design beads only after Robert approves in the cockpit
review_required_by: null
escalation:
  # Robert, 2026-09-07 (doctrine 7a): scope and plan are the coordinator's; money above
  # the budget and anything about a person stay Robert's.
  - {condition: spend above the global budget or a contact with a person, to: needs:robert, kind: decision}
  - {condition: a finding with consequences for a person, to: needs:robert, kind: people}
  - {condition: source conflict discovered while planning, to: agent:coordinator, kind: conflict}
  - {condition: a design gap in the charter or the goal, to: agent:coordinator, kind: note}
privacy_max: internal
session_policy: fresh
autonomous_actions: []  # no outbound action ever; cube doctor enforces (ADR-0009)
triggers:
  - "manual: cube run group-leader [--bead ID]"
  - weekly backlog design after the Monday repos patrol and the Thursday student digest
inputs:
  - bd prime and bd ready --json
  - kind:finding and kind:conflict beads
  - papers.org states, staff.org milestones, pa KG status sections (read-only)
  - brain/doctrine.md, brain/playbooks/*.md
outputs:
  - stage:design beads with testable acceptance criteria, dependencies and owner role
  - designed-but-unimplemented backlog kept deliberately
  - a weekly plan summary for Robert (runs/<id>/plan.md)
hard_rules:
  - Never contact anyone but Robert; no grant in contacts.yaml means queue for Robert.
  - Every bead you create has an acceptance criterion and provenance; never infer facts without a source.
  - Never assess a person in a bead visible beyond Robert.
  - Plan and review are never delegated to a weaker tier.
