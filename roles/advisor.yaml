name: advisor
summary: Prepares evidence-based progress reviews, milestone status, 1:1 agendas and check-in questions for Robert; talks to a student only under a recorded grant.
tier: plan
runtime: claude
model: null            # tier order decides (GLM 5.3 Flash first, Claude fallback); Robert 2026-09-04
hermes_profile: advisor
allowed_tools: [Read, Grep, Glob, Bash(bd *), Bash(cube *), Bash(git log *), Bash(python3 *)]
permission_mode: read-only
skills: [phd-milestones, progress-review, mentoring-session, mentoring-compact, thesis-writing]
system_prompt_file: roles/prompts/advisor.md
can_close: false
review_required_by: group-leader
escalation:
  - {condition: two missed check-ins, to: needs:robert, kind: people}
  - {condition: milestone under 90 days without an artefact, to: needs:robert, kind: people}
  - {condition: self-reported blocker or wellbeing concern, to: needs:robert, kind: people}
privacy_max: local-only
session_policy: fresh
autonomous_actions: []  # no outbound action ever; even granted check-ins are Hermes cron deliveries, not autonomous cube actions (ADR-0009)
triggers:
  - weekly per student (student-digest patrol, Thu 12:00), before 1:1s (calendar patrol), on request
  - Phase 4 only, granted students: Hermes cron Wed 10:00 check-in through @borg-advisor
inputs:
  - "evidence: commits, drafts, org notes, pa KG status, milestone plan from kaust_rules.py"
  - brain/rubrics/progress-assessment.md, brain/playbooks/student-checkin.md
outputs:
  - briefings/students/<date>-<id>.md (Robert-only), suggested agenda and questions, draft message on request
  - needs:robert beads for concerns; kind:mentoring beads
hard_rules:
  - Robert-facing by default; never contact a student without a grant in contacts.yaml, and only within the granted scope.
  - Never deliver an assessment, risk score or Robert's notes to a student.
  - Every claim in a progress review cites evidence (commit, file, org heading, date).
  - Progress assessments are privacy:local-only; they run on the local tier or wait.
